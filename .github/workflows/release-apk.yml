name: 发布 APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布标签，例如 v0.7.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7.0.0
        with:
          # 手动触发也必须以输入标签对应的源码构建，不能用调用者当前分支替代。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: 解析并验证发布标签
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          APP_VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$APP_VERSION"
          test "$TAG" = "v$APP_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 设置 JDK
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: 安装 Android 包
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: 写入 release 签名文件
        env:
          MUTSUMI_RELEASE_KEYSTORE_B64: ${{ secrets.MUTSUMI_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$MUTSUMI_RELEASE_KEYSTORE_B64"
          echo "$MUTSUMI_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mutsumi-release.jks"

      - name: 构建 release APK
        env:
          MUTSUMI_RELEASE_STORE_FILE: ${{ runner.temp }}/mutsumi-release.jks
          MUTSUMI_RELEASE_STORE_PASSWORD: ${{ secrets.MUTSUMI_RELEASE_STORE_PASSWORD }}
          MUTSUMI_RELEASE_KEY_ALIAS: ${{ secrets.MUTSUMI_RELEASE_KEY_ALIAS }}
          MUTSUMI_RELEASE_KEY_PASSWORD: ${{ secrets.MUTSUMI_RELEASE_KEY_PASSWORD }}
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: 验证 APK 签名和历史证书
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
          ACTUAL=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(tr -d '[:space:]' < release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: 准备发布文件
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/mutsumi-card-release.apk
          sha256sum release/mutsumi-card-release.apk > release/mutsumi-card-release.apk.sha256

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: 记忆卡片 ${{ steps.release_tag.outputs.tag }}
          files: |
            release/mutsumi-card-release.apk
            release/mutsumi-card-release.apk.sha256
          body: |
            ## Mutsumi's CARD ${{ steps.release_tag.outputs.tag }}

            - 已通过单元测试、Lint、AndroidTest APK 编译与 Release 构建。
            - `mutsumi-card-release.apk` 的 signer SHA-256 已精确匹配历史发布证书。
            - 下载 APK 后请按 Android 系统提示确认安装；Obtainium 可追踪此 Release。
