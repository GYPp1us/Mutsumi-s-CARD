name: 发布 APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布标签，例如 v0.8.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7.0.0
        with:
          # 手动触发也必须以输入标签对应的源码构建，不能用调用者当前分支替代。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: 解析并验证发布标签
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          APP_VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$APP_VERSION"
          test "$TAG" = "v$APP_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 设置 JDK
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools

      - name: 安装 Android 包
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: 准备 Rust 与 Android 目标
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: 缓存 Rust 构建
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/md2svg-jni/target
          key: ${{ runner.os }}-md2svg-${{ hashFiles('native/md2svg-jni/Cargo.lock') }}

      - name: 验证 Rust SDK 集成
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --locked --manifest-path native/md2svg-jni/Cargo.toml

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: 写入 release 签名文件
        env:
          MUTSUMI_RELEASE_KEYSTORE_B64: ${{ secrets.MUTSUMI_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$MUTSUMI_RELEASE_KEYSTORE_B64"
          echo "$MUTSUMI_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mutsumi-release.jks"

      - name: 构建 release APK
        env:
          CARGO_BUILD_JOBS: 2
          MUTSUMI_RELEASE_STORE_FILE: ${{ runner.temp }}/mutsumi-release.jks
          MUTSUMI_RELEASE_STORE_PASSWORD: ${{ secrets.MUTSUMI_RELEASE_STORE_PASSWORD }}
          MUTSUMI_RELEASE_KEY_ALIAS: ${{ secrets.MUTSUMI_RELEASE_KEY_ALIAS }}
          MUTSUMI_RELEASE_KEY_PASSWORD: ${{ secrets.MUTSUMI_RELEASE_KEY_PASSWORD }}
        run: |
          bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug
          bash gradlew --no-daemon -PsplitApks=true :app:assembleRelease

      - name: 验证各架构、版本、压缩及历史签名并准备发布
        env:
          RELEASE_VERSION: ${{ steps.release_tag.outputs.tag }}
        run: |
          python3 scripts/prepare_release.py

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: 记忆卡片 ${{ steps.release_tag.outputs.tag }}
          draft: true
          files: |
            release/*.apk
            release/*.sha256
            release/包体报告.md
          body: |
            ## Mutsumi's CARD ${{ steps.release_tag.outputs.tag }}

            - 在设置中输入 408 Dashboard 目录链接或密钥，读取科目与事项的实际 ID，并选择所需事项。
            - 仅在前台学习且有卡片时，以固定来源 `mutsumi_card` 每 20 秒上报一次；离开或进入后台立即发送 idle。
            - 密钥在设备 Keystore 加密并放入不参与备份的私有目录，不包含在 APK、仓库、日志和截图中。
            - 409 表示另一处专注正在进行或当日已结算，应用会暂停心跳，待用户重新启用。
            - 锁定文字 key 后，右侧属性栏平滑收成竖向工具轨，空间均分给两个卡面；解锁保留全部内容。
            - 按 arm64-v8a、armeabi-v7a、x86_64 分发独立安装包，新版更新器优先选择匹配设备的包。
            - 开启未使用代码与资源裁剪、原生库压缩，并复用重复许可证原文。
            - 大多数新手机请选择 `mutsumi-card-arm64-v8a-release.apk`；旧款 32 位 ARM 设备选 `armeabi-v7a`，模拟器或 Intel 设备选 `x86_64`。
            - `mutsumi-card-release.apk` 为兼容旧更新器和 Obtainium 的通用包，各包均使用同一历史签名并包含 SHA-256 附件。
            - 各安装包的实际大小见附件“包体报告.md”。
